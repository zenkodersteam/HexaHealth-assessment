<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notes API Demo</title>
<style>
  :root { font-family: system-ui, Arial, sans-serif; }
  body { max-width: 720px; margin: 40px auto; padding: 0 16px; color: #0f172a; }
  h1 { margin-bottom: 4px; }
  form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  input, textarea { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
  button { padding: 8px 16px; border: none; border-radius: 6px; background: #4338ca; color: #fff; cursor: pointer; width: fit-content; }
  button:hover { background: #312e81; }
  ul { list-style: none; padding: 0; }
  li { border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  li h3 { margin: 0 0 4px; }
  .meta { color: #64748b; font-size: 0.85rem; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .actions button { background: #64748b; }
  .actions button.delete { background: #dc2626; }
  .edit-form { display: flex; flex-direction: column; gap: 8px; }
  .edit-form.hidden, .view.hidden { display: none; }
  .edit-actions { display: flex; gap: 8px; }
  .edit-actions button.cancel { background: #64748b; }
</style>
</head>
<body>
  <h1>Notes API Demo</h1>
  <p class="meta">Simple frontend hitting the CRUD endpoints at <code>/notes</code>.</p>

  <form id="create-form">
    <input id="title" placeholder="Title" required />
    <textarea id="content" placeholder="Content" required></textarea>
    <button type="submit">Add Note</button>
  </form>

  <ul id="notes-list"></ul>

<script>
  const API = '/notes';
  const list = document.getElementById('notes-list');
  const form = document.getElementById('create-form');

  async function loadNotes() {
    const res = await fetch(API);
    const notes = await res.json();
    list.innerHTML = '';
    notes.forEach(renderNote);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderNote(note) {
    const li = document.createElement('li');
    li.innerHTML = `
      <div class="view">
        <h3 class="title">${escapeHtml(note.title)}</h3>
        <p class="content">${escapeHtml(note.content)}</p>
        <div class="meta">Updated: ${new Date(note.updatedAt).toLocaleString()}</div>
        <div class="actions">
          <button class="edit">Edit</button>
          <button class="delete">Delete</button>
        </div>
      </div>
      <form class="edit-form hidden">
        <input class="edit-title" value="${escapeHtml(note.title)}" required />
        <textarea class="edit-content" required>${escapeHtml(note.content)}</textarea>
        <div class="edit-actions">
          <button type="submit">Save</button>
          <button type="button" class="cancel">Cancel</button>
        </div>
      </form>
    `;

    const view = li.querySelector('.view');
    const editForm = li.querySelector('.edit-form');

    li.querySelector('.edit').addEventListener('click', () => {
      view.classList.add('hidden');
      editForm.classList.remove('hidden');
      li.querySelector('.edit-title').focus();
    });

    li.querySelector('.cancel').addEventListener('click', () => {
      editForm.classList.add('hidden');
      view.classList.remove('hidden');
    });

    editForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = li.querySelector('.edit-title').value;
      const content = li.querySelector('.edit-content').value;
      await fetch(`${API}/${note.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content }),
      });
      loadNotes();
    });

    li.querySelector('.delete').addEventListener('click', async () => {
      await fetch(`${API}/${note.id}`, { method: 'DELETE' });
      loadNotes();
    });

    list.appendChild(li);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('title').value;
    const content = document.getElementById('content').value;
    await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, content }),
    });
    form.reset();
    loadNotes();
  });

  loadNotes();
</script>
</body>
</html>
